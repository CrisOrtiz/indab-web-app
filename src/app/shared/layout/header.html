@let t = i18n.messages().header;
<header class="header">
  <div class="container header-inner">
    <a routerLink="/" class="brand">
      <img src="logo.jpg" alt="INDAB Academy" width="40" height="40" />
      <span>INDAB</span>
    </a>
    <nav class="nav">
      <a routerLink="/eleva" routerLinkActive="active">{{ t.eleva }}</a>
      @if (auth.isLoggedIn()) {
        <a routerLink="/academy" routerLinkActive="active">{{ t.academy }}</a>
        @if (auth.isStaff()) {
          <a routerLink="/admin" routerLinkActive="active">{{ t.admin }}</a>
        }
        <button type="button" class="btn btn-outline" (click)="signOut()">{{ t.signOut }}</button>
      } @else {
        <a routerLink="/login" class="btn">{{ t.signIn }}</a>
      }
    </nav>
    <app-language-switcher class="language" />
  </div>
</header>
