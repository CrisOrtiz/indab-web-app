@let t = i18n.messages().header;
<header class="header">
  <div class="container header-inner">
    <a routerLink="/" class="brand">
      <img src="logo.jpg" alt="INDAB Academy" width="40" height="40" />
      <span>INDAB</span>
    </a>
    <nav class="nav">
      <a routerLink="/eleva" routerLinkActive="active">{{ t.eleva }}</a>
      @if (auth.isLoggedIn()) {
        <a routerLink="/academy" routerLinkActive="active">{{ t.academy }}</a>
        @if (auth.isStaff()) {
          <a routerLink="/admin" routerLinkActive="active">{{ t.admin }}</a>
        }
      } @else {
        <a routerLink="/login" class="btn">{{ t.signIn }}</a>
      }
    </nav>
    <app-language-switcher class="language" />
    @if (auth.isLoggedIn()) {
      <div class="account">
        <button
          type="button"
          class="avatar-button"
          aria-haspopup="menu"
          [attr.aria-expanded]="menuOpen()"
          aria-controls="account-menu"
          [attr.aria-label]="t.account"
          [title]="name()"
          (click)="toggleMenu()"
        >
          <app-avatar [photo]="photo()" [name]="name()" [size]="36" />
        </button>
        @if (menuOpen()) {
          <div class="menu" id="account-menu" role="menu" [attr.aria-label]="t.account">
            <div class="who">
              <strong>{{ name() }}</strong>
              @if (auth.user()?.email; as email) {
                <span>{{ email }}</span>
              }
            </div>
            <a role="menuitem" routerLink="/profile">{{ t.profile }}</a>
            <button role="menuitem" type="button" (click)="signOut()">{{ t.signOut }}</button>
          </div>
        }
      </div>
    }
  </div>
</header>
