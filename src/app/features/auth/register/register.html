<section class="auth">
  <div class="card">
    <h1>Crear cuenta</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Nombre completo
        <input type="text" formControlName="displayName" autocomplete="name" />
      </label>
      @if (form.controls.displayName.touched && form.controls.displayName.invalid) {
        <p class="error">Ingresa tu nombre.</p>
      }
      <label>
        Correo electrónico
        <input type="email" formControlName="email" autocomplete="email" />
      </label>
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="error">Ingresa un correo válido.</p>
      }
      <label>
        Contraseña
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>
      <p class="hint">Mínimo 6 caracteres.</p>
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      <button type="submit" class="btn" [disabled]="loading()">Crear cuenta</button>
    </form>
    <div class="links">
      <span>¿Ya tienes cuenta?</span>
      <a routerLink="/login">Ingresar</a>
    </div>
  </div>
</section>
