<section class="auth">
  <div class="card">
    <h1>Ingresar</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Correo electrónico
        <input type="email" formControlName="email" autocomplete="email" />
      </label>
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="error">Ingresa un correo válido.</p>
      }
      <label>
        Contraseña
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      @if (notice()) {
        <p class="notice" role="status">{{ notice() }}</p>
      }
      <button type="submit" class="btn" [disabled]="loading()">Ingresar</button>
    </form>
    <p class="divider">o</p>
    <button type="button" class="btn btn-outline" [disabled]="loading()" (click)="signInWithGoogle()">
      Continuar con Google
    </button>
    <div class="links">
      <button type="button" (click)="resetPassword()">¿Olvidaste tu contraseña?</button>
      <a routerLink="/register">Crear cuenta</a>
    </div>
  </div>
</section>
