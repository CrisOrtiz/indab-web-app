<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>INDAB Academy</title>
    <meta
      name="description"
      content="INDAB Academy: formación en trading. Conocimiento, disciplina, estrategia, resultados."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Light or dark mode before the first paint, so pages do not flash (ThemeService). -->
    <script>
      try {
        var theme = localStorage.getItem('indab.theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').content = '#121212';
        }
      } catch (e) {}
    </script>
    <!-- Page-specific description, canonical and Open Graph tags are set by Seo (core/seo). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "INDAB Academy",
        "url": "https://indab-academy.web.app/",
        "logo": "https://indab-academy.web.app/icon-512.png",
        "description": "Academia de trading: conocimiento, disciplina, estrategia y resultados.",
        "slogan": "Conocimiento. Disciplina. Estrategia. Resultados.",
        "subOrganization": {
          "@type": "Organization",
          "name": "Eleva Inversiones",
          "url": "https://indab-academy.web.app/eleva"
        }
      }
    </script>
  </head>
  <body>
    <!-- Shown until the app starts; AppLoader (src/app/shared/loader) replaces it. -->
    <div id="boot-loader" class="app-loader app-loader--boot" aria-hidden="true">
      <img class="app-loader__logo" src="logo.jpg" alt="" width="96" height="96" />
      <span class="app-loader__shadow"></span>
    </div>
    <app-root></app-root>
  </body>
</html>
