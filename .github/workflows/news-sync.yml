# Copies the economic news the practice chart shows (Finance Calendar, financecalendar.com)
# into Firestore marketNews/{YYYY-MM}, every day and on demand. Needs two repository secrets:
#   FINANCE_CALENDAR_API_KEY               API key of a free financecalendar.com account
#   FIREBASE_SERVICE_ACCOUNT_INDAB_ACADEMY the deploy service account, which also needs the
#                                          "Cloud Datastore User" role (README, "News on the
#                                          practice chart")
# Run it by hand with a "from" month (e.g. 2025-11) to fill in older months.
name: News sync

on:
  schedule:
    # 09:15 UTC: after Finance Calendar's overnight update, before the US releases.
    - cron: '15 9 * * *'
    # 13:45 UTC: after the 8:30 ET releases, so the day's figures show the same day.
    - cron: '45 13 * * 1-5'
  workflow_dispatch:
    inputs:
      from:
        description: First month to copy (YYYY-MM); empty = last month
        required: false
      to:
        description: Last month to copy (YYYY-MM); empty = next month
        required: false

permissions:
  contents: read

concurrency:
  group: news-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Copy news to Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FINANCE_CALENDAR_API_KEY: ${{ secrets.FINANCE_CALENDAR_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INDAB_ACADEMY }}
      NEWS_FROM: ${{ inputs.from }}
      NEWS_TO: ${{ inputs.to }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Copy news
        if: env.FINANCE_CALENDAR_API_KEY != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: node scripts/sync-news.mts
      - name: Missing secrets
        if: env.FINANCE_CALENDAR_API_KEY == '' || env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "::warning::Set FINANCE_CALENDAR_API_KEY and FIREBASE_SERVICE_ACCOUNT_INDAB_ACADEMY to copy the news."
