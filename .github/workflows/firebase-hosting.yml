# Builds the app and deploys it to Firebase Hosting (project indab-academy).
#   - push to main          -> live site (https://indab-academy.web.app)
#   - pull request          -> temporary preview URL, posted as a PR comment
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT_INDAB_ACADEMY (see README,
# "Automatic deploys"). Without it the build still runs and the deploy step is skipped.
name: Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INDAB_ACADEMY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Deploy preview channel
        if: github.event_name == 'pull_request' && env.HAS_FIREBASE_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INDAB_ACADEMY }}
          projectId: indab-academy
          expires: 7d

      - name: Deploy live site
        if: github.event_name == 'push' && env.HAS_FIREBASE_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INDAB_ACADEMY }}
          projectId: indab-academy
          channelId: live
