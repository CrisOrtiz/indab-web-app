# Deletes Firebase Hosting preview channels (project indab-academy). The live site is never touched.
#   - pull request merged or closed -> deletes that PR's preview
#   - manual run (Actions > Delete previews > Run workflow) -> deletes every preview
# Previews also expire on their own after 1 day (ci.yml).
name: Delete previews

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    name: Delete preview channels
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INDAB_ACADEMY }}
      # Preview channels are named pr<number>-<branch> by the deploy action.
      CHANNEL_PREFIX: ${{ github.event_name == 'pull_request' && format('pr{0}-', github.event.pull_request.number) || 'pr' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Delete matching channels
        if: env.FIREBASE_KEY != ''
        run: |
          key_file="$RUNNER_TEMP/firebase-key.json"
          printf '%s' "$FIREBASE_KEY" > "$key_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$key_file"
          channels=$(npx firebase hosting:channel:list --site indab-academy --project indab-academy --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const ids=JSON.parse(s).result.channels.map(c=>c.name.split("/").pop());
                console.log(ids.filter(id=>id!=="live"&&id.startsWith(process.env.CHANNEL_PREFIX)).join("\n"));})')
          if [ -z "$channels" ]; then echo "No preview channels to delete."; fi
          for id in $channels; do
            echo "Deleting preview channel $id"
            npx firebase hosting:channel:delete "$id" --site indab-academy --project indab-academy --force
          done
          rm -f "$key_file"
